<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>AskOps Issue Library</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="container">
      <header class="hero">
        <p class="eyebrow">AskOps Knowledge Base</p>
        <h1>Find proven fixes fast</h1>
        <p class="hero-copy">
          Search across known issues and solutions from the shared repository dataset.
        </p>

        <form id="search-form" class="search-form" role="search">
          <input
            id="search-input"
            name="query"
            type="search"
            placeholder="Search issues, problem keywords, or solutions"
            autocomplete="off"
          />
          <button type="submit">Search</button>
        </form>
        <p id="search-status" class="search-status"></p>
      </header>

      <section class="section-head">
        <h2>Recent Issues</h2>
        <button id="clear-search" type="button" class="secondary-btn" hidden>Show Recent</button>
      </section>

      <section id="issue-list" class="issue-list"></section>
    </main>

    <script src="app.js"></script>
  </body>
</html>
